name: CLI release
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: cli-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
  release:
    timeout-minutes: 15
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - name: 准备源码绑定的发布版本
        run: npx -y @zjarlin/aio@__AIO_VERSION__ tool release prepare
      - run: npm test
      - run: npm run build --if-present
      - name: 验证安装包并发布 npm
        run: npx -y @zjarlin/aio@__AIO_VERSION__ tool release publish
      - name: 同步 AIO 插件市场
        run: npx -y @zjarlin/aio@__AIO_VERSION__ tool release sync
