[package]
name = "__NAME__"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
topcoat = { version = "0.6.2", default-features = false, features = ["discover", "router", "serve", "view"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
