name: npm release

on:
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: "复用已成功构建的工作流 ID（仅允许 npm 元数据变更）"
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: 校验发布来源
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.release-check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: 校验发布版本
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node npm/aio/scripts/check-release.cjs "$GITHUB_REF_NAME"
          else
            node npm/aio/scripts/check-release.cjs
          fi
      - name: 校验发布提交属于 main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
      - name: 判断是否需要发布
        id: release-check
        run: node npm/aio/scripts/should-publish.cjs

  build:
    if: needs.verify.outputs.should_publish == 'true' && inputs.artifacts_run_id == ''
    name: 构建 ${{ matrix.id }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            executable: aio
          - id: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: aio
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: aio
          - id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: aio
          - id: win32-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: aio.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 固定动作提交
        with:
          toolchain: nightly-2026-05-25
          targets: ${{ matrix.target }}
      - name: 安装 Linux musl 工具链
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: 构建 CLI
        run: cargo build --locked --release -p az-aio-cli --target ${{ matrix.target }}
      - name: 验证 CLI 可执行
        shell: bash
        run: '"target/${{ matrix.target }}/release/${{ matrix.executable }}" --help'
      - name: 构建配套开发宿主
        if: matrix.id == 'darwin-arm64' || matrix.id == 'linux-x64'
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install dioxus-cli --version 0.7.9 --locked
          if [[ "${{ matrix.id }}" == "linux-x64" ]]; then
            rustup target add x86_64-unknown-linux-gnu
            pip install cargo-zigbuild==0.23.4 ziglang==0.16.0
            cargo zigbuild --locked --release -p aio-host --target x86_64-unknown-linux-gnu.2.17
            host_binary=target/x86_64-unknown-linux-gnu/release/aio-host
          else
            cargo build --locked --release -p aio-host --target ${{ matrix.target }}
            host_binary=target/${{ matrix.target }}/release/aio-host
          fi
          dx build --package aio-host --platform web --release --no-default-features --features web --debug-symbols false
          mkdir -p npm-artifact
          cp "$host_binary" npm-artifact/aio-host
          cp -R target/dx/aio-host/release/web/public npm-artifact/web
          npm-artifact/aio-host --version
      - name: 整理构建产物
        shell: bash
        run: |
          mkdir -p npm-artifact
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" npm-artifact/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.id }}
          path: npm-artifact/
          if-no-files-found: error

  publish:
    name: 发布 npm 包
    needs: [verify, build]
    if: needs.verify.result == 'success' && needs.verify.outputs.should_publish == 'true' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.artifacts_run_id != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 校验复用构建产物
        if: inputs.artifacts_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
        run: node npm/aio/scripts/verify-reuse.cjs
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: npm/artifacts
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: 校验发布版本
        run: node npm/aio/scripts/check-release.cjs
      - name: 测试 npm 入口
        run: npm test --prefix npm/aio
      - name: 生成平台包
        run: node npm/aio/scripts/stage-platform-packages.cjs npm/artifacts npm/platform-packages
      - name: 检查发布内容
        run: |
          npm pack --dry-run ./npm/aio
          for package in ./npm/platform-packages/*; do npm pack --dry-run "$package"; done
      - name: 发布平台包和入口包
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/aio/scripts/publish-packages.cjs npm/platform-packages
