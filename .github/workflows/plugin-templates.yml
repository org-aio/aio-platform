name: Plugin templates

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "lib/plugin/host/**"
      - "lib/plugin/manifest/**"
      - "docs/plugin/**"
      - ".github/workflows/plugin-templates.yml"
  pull_request:
    paths:
      - "cli/**"
      - "lib/plugin/host/**"
      - "lib/plugin/manifest/**"
      - "docs/plugin/**"
      - ".github/workflows/plugin-templates.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 启用模板指定的 pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"

      - name: 构建 AIO CLI
        run: cargo build -p az-aio-cli

      - name: 安装固定的 Kotlin Component 工具链
        run: |
          cargo install --locked --git https://github.com/Kotlin/wit-bindgen.git --rev 700f2db5e1d01f7bee8d756750c6f631171f520e wit-bindgen-cli
          cargo install --locked wasm-tools --version 1.240.0

      - name: 验证 Kotlin Toolchain process 模板
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: |
          plugin="$RUNNER_TEMP/aio-plugin-generated-kmp"
          target/debug/aio plugin init "$plugin" --title "生成的 Kotlin 插件" --language kotlin --runtime process
          cd "$plugin"
          ./kotlin check
          ./kotlin build -m model -p wasmJs
          ./kotlin package -m service -p jvm -f executable-jar
          mkdir -p dist
          cp build/tasks/_service_executableJarJvm/service-jvm-executable.jar dist/plugin.jar
          "$GITHUB_WORKSPACE/target/debug/aio" plugin validate

      - name: 验证 Kotlin Toolchain page-definition 模板
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: |
          plugin="$RUNNER_TEMP/aio-plugin-generated-kmp-pages"
          target/debug/aio plugin init "$plugin" --title "生成的 Kotlin 页面" --language kotlin --runtime page-definition
          cd "$plugin"
          ./kotlin check
          ./kotlin build -m model -p jvm -p wasmJs
          ./kotlin run -m generator -p jvm -- dist/pages.json
          "$GITHUB_WORKSPACE/target/debug/aio" plugin validate

      - name: 验证 Kotlin Toolchain Wasm Component 模板
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: |
          plugin="$RUNNER_TEMP/aio-plugin-generated-kmp-component"
          target/debug/aio plugin init "$plugin" --title "生成的 Kotlin Component" --language kotlin --runtime wasm-component
          cd "$plugin"
          ./kotlin check
          ./scripts/generate-bindings.sh --check
          ./scripts/build-component.sh
          "$GITHUB_WORKSPACE/target/debug/aio" plugin validate

      - name: 验证 TypeScript Wasm Component 模板
        run: |
          plugin="$RUNNER_TEMP/aio-plugin-generated-ts"
          target/debug/aio plugin init "$plugin" --title "生成的 TypeScript 插件" --language typescript --runtime wasm-component
          cd "$plugin"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          "$GITHUB_WORKSPACE/target/debug/aio" plugin validate

      - name: 验证 TypeScript process 模板
        run: |
          plugin="$RUNNER_TEMP/aio-plugin-generated-node"
          target/debug/aio plugin init "$plugin" --title "生成的 Node 插件" --language typescript --runtime process
          cd "$plugin"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          "$GITHUB_WORKSPACE/target/debug/aio" plugin validate

      - name: 验证 TypeScript page-definition 模板
        run: |
          plugin="$RUNNER_TEMP/aio-plugin-generated-ts-pages"
          target/debug/aio plugin init "$plugin" --title "生成的 TypeScript 页面" --language typescript --runtime page-definition
          cd "$plugin"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          "$GITHUB_WORKSPACE/target/debug/aio" plugin validate

      - name: 验证生成 Component 的租户隔离
        run: |
          AIO_TEST_WASM_COMPONENT="$RUNNER_TEMP/aio-plugin-generated-ts/dist/plugin.wasm" \
            cargo test -p az-plugin-host --no-default-features --features wasm --lib activates_reuses_and_destroys_tenant_instances -- --ignored
          AIO_TEST_WASM_COMPONENT="$RUNNER_TEMP/aio-plugin-generated-kmp-component/dist/plugin.wasm" \
            cargo test -p az-plugin-host --no-default-features --features wasm --lib activates_reuses_and_destroys_tenant_instances -- --ignored
