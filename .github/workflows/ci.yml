name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 超时测试会故意占用解释器；串行执行，避免其他用例因调度等待耗尽 100ms 预算。
    env:
      RUST_TEST_THREADS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: channel-test
          POSTGRES_DB: channel_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly-2026-05-25
          components: clippy, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo fmt --all --check
      - run: node scripts/check-boundaries.mjs
      - run: node --test sdk/web/bridge.test.mjs sdk/web/file-drop.test.mjs sdk/web/device-transport.test.mjs sdk/web/static-transport.test.mjs cli/src/tools/release.test.cjs
      - name: 验证精简宿主与独立执行器编译边界
        run: |
          node scripts/check-host-features.mjs
          for executor_profile in server wasm sidecar rhai typescript mcp grpc remote-mcp remote-grpc remote; do
            cargo clippy -p az-plugin-host --no-default-features --features "$executor_profile" --lib -- -D warnings
            cargo clippy -p az-plugin-host --no-default-features --features "$executor_profile" --all-targets -- -D warnings
          done
          cargo test -p az-plugin-host --no-default-features --features server
          for language_profile in rhai typescript; do
            cargo test -p az-plugin-host --no-default-features --features "$language_profile" --test executor_plugins
          done
          for protocol_profile in mcp grpc; do
            cargo test -p az-plugin-host --no-default-features --features "$protocol_profile" --test capability_protocols
          done
          for protocol_profile in remote-mcp remote-grpc remote; do
            cargo test -p az-plugin-host --no-default-features --features "$protocol_profile" remote::tests
          done
          AIO_REMOTE_TEST_CREDENTIAL=remote-test cargo test -p az-plugin-host --no-default-features --features remote --test capability_plugins -- --include-ignored
          cargo test -p az-plugin-runtime --no-default-features
          cargo test -p az-plugin-manifest --no-default-features --features validation
          cargo clippy -p az-plugin-manifest --no-default-features --features validation --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p az-plugin-core --no-default-features
      - run: cargo test -p az-plugin-enhancement --no-default-features
      - name: 验证增强持久化、隔离、并发激活与回滚
        run: |
          psql "$AIO_ENHANCEMENT_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC;'
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc enhancements::tests -- --ignored --test-threads=1
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc plugins::tests -- --test-threads=1
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc plugins::infrastructure_tests -- --include-ignored --test-threads=1
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc plugins::lifecycle_tests -- --ignored --test-threads=1
          cargo test -p az-plugin-host --features server,wasm,sidecar,rhai,typescript,mcp,grpc --test service_plugins -- --ignored
          for protocol_profile in mcp grpc; do
            cargo test -p az-plugin-host --no-default-features --features "$protocol_profile" --test executor_plugins -- --include-ignored
          done
          cargo build -p az-plugin-host --no-default-features --features remote --example mcp-stdio-fixture
          cargo test -p az-plugin-host --lib --no-default-features --features remote,mcp,grpc,rhai,typescript protocols::tests -- --ignored --test-threads=1
          cargo test -p az-plugin-host --lib --no-default-features --features sidecar,rhai,typescript sidecar_enhancements_bind_identity_grants_and_active_revision -- --ignored
        env:
          AIO_ENHANCEMENT_TEST_DATABASE_URL: postgresql://postgres:channel-test@127.0.0.1:5432/channel_test
          AIO_REMOTE_TEST_CREDENTIAL: remote-test
          AIO_MCP_STDIO_TEST_EXECUTABLE: ${{ github.workspace }}/target/debug/examples/mcp-stdio-fixture
          AIO_MCP_STDIO_TEST_TOKEN: stdio-test
          AIO_MCP_STDIO_HOST_SECRET: must-not-inherit
      - name: 验证 sidecar 任务、设备视图消息、资源及撤权
        run: |
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc workspace_access_cancel_and_bridge_isolation -- --ignored
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc webview_channel_roundtrip_isolation_and_revocation -- --ignored
        env:
          AIO_TEST_DATABASE_URL: postgresql://postgres:channel-test@127.0.0.1:5432/channel_test
      - run: cargo build --manifest-path lib/plugin/runtime/tests/fixture/Cargo.toml --locked --release --target wasm32-wasip2 --target-dir target/fixture/healthy
      - name: 验证可替换整包执行器与 Sidecar 资源生命周期
        run: |
          psql "$AIO_ENHANCEMENT_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE component_market_test;'
          psql "$AIO_ENHANCEMENT_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wasm_component_market_test;'
          psql "$AIO_COMPONENT_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC;'
          psql "$AIO_WASM_COMPONENT_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC;'
          cargo test -p az-plugin-host --no-default-features --features server --test component_executors -- --include-ignored --test-threads=1
          cargo test -p az-plugin-host --no-default-features --features wasm,sidecar --test component_executors resources:: -- --include-ignored --test-threads=1
          AIO_TEST_DATABASE_URL="$AIO_COMPONENT_TEST_DATABASE_URL" AIO_TEST_SECOND_DATABASE_URL="$AIO_WASM_COMPONENT_TEST_DATABASE_URL" cargo test -p az-plugin-runtime --no-default-features --lib persistence:: -- --ignored --test-threads=1
          AIO_TEST_DATABASE_URL="$AIO_COMPONENT_TEST_DATABASE_URL" cargo test -p az-plugin-runtime --no-default-features --lib database::tests -- --ignored --test-threads=1
          AIO_COMPONENT_TEST_DATABASE_URL="$AIO_WASM_COMPONENT_TEST_DATABASE_URL" cargo test -p az-plugin-host --lib --no-default-features --features wasm published_components_install_optionally_and_restore -- --ignored
          cargo test -p az-plugin-host --lib --no-default-features --features wasm tenant_installation_grants_members_and_menu_visibility_preserves_runtime -- --ignored
          export AIO_PROCESS_ROOT="$(mktemp -d)"
          export AIO_PLUGIN_SUPERVISOR_SOCKET="$AIO_PROCESS_ROOT/supervisor.sock"
          trap 'rm -rf "$AIO_PROCESS_ROOT"' EXIT
          cargo test -p az-plugin-host --lib --no-default-features --features sidecar publication_preserves_running_singleton_process -- --ignored
          export AIO_PLUGIN_SUPERVISOR_SOCKET="$AIO_PROCESS_ROOT/combined-supervisor.sock"
          cargo test -p az-plugin-host --lib --no-default-features --features wasm,sidecar publication_preserves_running_singleton_process -- --ignored
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc development_switch_preserves_cli_ownership_and_refreshes_frontend -- --ignored
          cargo test -p az-plugin-host --lib --features server,wasm,sidecar,rhai,typescript,mcp,grpc protected_wasm_and_sidecar_require_live_interaction_through_the_broker -- --ignored
        env:
          AIO_TEST_HEALTHY_COMPONENT: ${{ github.workspace }}/target/fixture/healthy/wasm32-wasip2/release/release_fixture.wasm
          AIO_PLUGIN_SUPERVISOR_SOCKET: /tmp/aio-component-executor-absent.sock
          AIO_ENHANCEMENT_TEST_DATABASE_URL: postgresql://postgres:channel-test@127.0.0.1:5432/channel_test
          AIO_COMPONENT_TEST_DATABASE_URL: postgresql://postgres:channel-test@127.0.0.1:5432/component_market_test
          AIO_WASM_COMPONENT_TEST_DATABASE_URL: postgresql://postgres:channel-test@127.0.0.1:5432/wasm_component_market_test
      - run: cargo build --manifest-path lib/plugin/runtime/tests/fixture/Cargo.toml --locked --release --target wasm32-wasip2 --features unhealthy --target-dir target/fixture/unhealthy
      - run: cargo build --manifest-path lib/plugin/runtime/tests/fixture/Cargo.toml --locked --release --target wasm32-wasip2 --features enhancements --target-dir target/fixture/enhancements
      - run: cargo test -p az-plugin-runtime --features wasm --test enhancements -- --ignored
        env:
          AIO_TEST_ENHANCEMENT_COMPONENT: ${{ github.workspace }}/target/fixture/enhancements/wasm32-wasip2/release/release_fixture.wasm
      - run: cargo test -p az-plugin-runtime --features wasm --test release -- --ignored
        env:
          AIO_TEST_HEALTHY_COMPONENT: ${{ github.workspace }}/target/fixture/healthy/wasm32-wasip2/release/release_fixture.wasm
          AIO_TEST_UNHEALTHY_COMPONENT: ${{ github.workspace }}/target/fixture/unhealthy/wasm32-wasip2/release/release_fixture.wasm
      - run: npm test --prefix npm/aio
      - run: cargo run -q -p az-aio-cli -- plugin schema docs/plugin/schema
      - run: git diff --exit-code docs/plugin/schema
      - run: cargo clippy --workspace --all-targets -- -D warnings
