name: Device npm publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已审核设备安装包的版本"
        required: true
        type: string
      revision:
        description: "设备版本标签对应的完整源码提交"
        required: true
        type: string
      release_tag:
        description: "保存设备安装包的 Platform Release 标签"
        required: true
        type: string
        default: "v2026.10.9"
      sha256:
        description: "已审核设备安装包的 SHA-256"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: device-npm-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    env:
      DEVICE_VERSION: ${{ inputs.version }}
      DEVICE_REVISION: ${{ inputs.revision }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - name: 下载已审核的设备发布包
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$DEVICE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEVICE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive_name="aio-device-${DEVICE_VERSION}.tgz"
          gh release download "$RELEASE_TAG" --repo org-aio/aio-platform --pattern "$archive_name"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive_name" | sha256sum --check
          tar -xzf "$archive_name"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package/package.json', 'utf8'));
          assert.equal(pkg.name, '@zjarlin/aio-device');
          assert.equal(pkg.version, process.env.DEVICE_VERSION);
          assert.equal(pkg.aio.cli.id, 'aio-plugin-device');
          assert.equal(pkg.aio.cli.command, 'aio-device');
          assert.deepEqual(pkg.aio.source, {
            repository: 'org-aio/aio-plugin-device',
            revision: process.env.DEVICE_REVISION,
            reference: 'refs/tags/v' + process.env.DEVICE_VERSION
          });
          NODE
      - name: 验证安装包命令
        run: npm exec --yes "--package=./aio-device-${DEVICE_VERSION}.tgz" -- aio-device --version
      - name: 发布设备组件
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          const archivePath = './aio-device-' + process.env.DEVICE_VERSION + '.tgz';
          const response = await fetch('https://registry.npmjs.org/@zjarlin%2Faio-device/' + encodeURIComponent(process.env.DEVICE_VERSION));
          if (response.status === 404) {
            execFileSync('npm', ['publish', archivePath, '--registry', 'https://registry.npmjs.org', '--access', 'public', '--tag', 'latest', '--ignore-scripts'], {stdio: 'inherit'});
          } else {
            assert.equal(response.status, 200, '读取 npm 发布状态失败');
            const published = await response.json();
            const pkg = JSON.parse(await readFile('package/package.json', 'utf8'));
            const archive = await readFile(archivePath);
            assert.deepEqual(published.aio.source, pkg.aio.source);
            assert.equal(published.dist.integrity, 'sha512-' + createHash('sha512').update(archive).digest('base64'));
            console.log('相同版本已发布，无需重复上传');
          }
          NODE
