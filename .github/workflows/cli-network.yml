name: CLI network initialization

on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli-network.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli-network.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: 验证 CLI 和离线初始化
        run: cargo test --locked -p az-aio-cli
      - name: 验证网络回退和缓存
        run: node --test cli/tests/network.test.cjs
      - name: 构建 CLI
        run: cargo build --locked -p az-aio-cli
      - name: 验证 Unix 工具链冷启动
        if: runner.os != 'Windows'
        shell: bash
        env:
          AIO_NETWORK: global
          AIO_JDK_DOWNLOAD: '1'
        run: |
          target/debug/aio plugin init network-smoke --language kotlin
          cd network-smoke
          ./kotlin --version
      - name: 验证 Windows 工具链冷启动
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AIO_NETWORK: global
          AIO_JDK_DOWNLOAD: '1'
        run: |
          & ./target/debug/aio.exe plugin init network-smoke --language kotlin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./network-smoke/kotlin.bat --version
          exit $LASTEXITCODE
