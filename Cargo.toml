[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arc-swap.workspace = true
async-stream = "0.3.6"
async-trait.workspace = true
axum.workspace = true
az-plugin-core.workspace = true
futures-util = "0.3.31"
matchit.workspace = true
rig-core = { version = "0.36.0", default-features = false, features = ["native-tls", "reqwest"] }
