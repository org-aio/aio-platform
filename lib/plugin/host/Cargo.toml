[package]
name = "az-plugin-host"
version = "2026.9.18"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
jsonwebtoken = { version = "10", features = ["aws_lc_rs"], optional = true }
az-tool = { path = "../../tool" }
az-plugin-development = { path = "../development" }
az-plugin-delivery = { path = "../delivery" }
base64 = "0.22.1"
anyhow = "1.0.99"
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
az-plugin-bundle = { path = "../bundle", optional = true }
az-plugin-contract = { path = "../contract", optional = true }
az-plugin-runtime = { path = "../runtime", optional = true }
semver = { version = "1", optional = true }
getrandom = { version = "0.4.2", optional = true }
axum = { version = "0.8.6", optional = true }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"], optional = true }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "75f69b0cfab604d6ab1047b967c1adb72a2a0521", default-features = false, optional = true }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "75f69b0cfab604d6ab1047b967c1adb72a2a0521", optional = true }
az-plugin-manifest = { path = "../manifest", default-features = false }
az-plugin-package = { path = "../package", optional = true }
gloo-net = { version = "0.6.0", features = ["http", "json"], optional = true }
flate2 = { version = "1.1.2", optional = true }
kuchikiki = { version = "=0.8.8-speedreader", optional = true }
mime_guess = { version = "2.0.5", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"], optional = true }
tar = { version = "0.4.44", optional = true }
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
toml = { version = "0.9.5", optional = true }
tower-http = { version = "0.6.2", features = ["fs", "compression-gzip"], optional = true }
uuid = { version = "1.18.1", features = ["v4", "v5"], optional = true }
wasmtime = { version = "48.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "gc-drc", "runtime", "std"], optional = true }
web-sys = { version = "0.3.77", features = ["AbortSignal", "Document", "Element", "Node", "Location", "Window"], optional = true }

[features]
test-support = ["server"]
components = ["dep:az-plugin-bundle", "dep:az-plugin-contract", "dep:az-plugin-runtime", "dep:async-trait", "dep:semver", "dep:getrandom", "dep:futures-util"]
default = []
ui = ["dep:dioxus", "dep:az-dioxus-admin-shell", "dep:az-ui-components"]
web = ["ui", "dioxus/web", "dioxus/launch", "dep:gloo-net", "dep:web-sys"]
desktop = ["ui", "dioxus/desktop", "dioxus/launch", "dep:gloo-net", "dep:web-sys"]
server = ["dep:jsonwebtoken","components", "az-plugin-manifest/validation", "dep:az-plugin-package", "dep:axum", "dep:flate2", "dep:kuchikiki", "dep:mime_guess", "dep:reqwest", "dep:sha2", "dep:sqlx", "dep:tar", "dep:tokio", "dep:toml", "dep:tower-http", "dep:uuid", "dep:wasmtime"]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3.23.0"
