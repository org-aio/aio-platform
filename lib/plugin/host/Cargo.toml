[package]
name = "az-plugin-host"
version = "2026.10.16"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
jsonwebtoken = { version = "10", features = ["aws_lc_rs"], optional = true }
az-tool = { path = "../../tool" }
az-plugin-development = { path = "../development" }
az-plugin-delivery = { path = "../delivery" }
base64 = "0.22.1"
anyhow = "1.0.99"
arc-swap = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
az-plugin-bundle = { path = "../bundle", optional = true }
az-plugin-contract = { path = "../contract", optional = true }
az-plugin-runtime = { path = "../runtime", default-features = false, optional = true }
az-plugin-core = { path = "../core", default-features = false, optional = true }
az-plugin-enhancement = { path = "../enhancement", optional = true }
semver = { version = "1", optional = true }
getrandom = { version = "0.4.2", optional = true }
axum = { version = "0.8.6", features = ["ws"], optional = true }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
tonic = { version = "0.14.6", optional = true }
prost = { version = "0.14.4", optional = true }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"], optional = true }
jsonschema = { version = "0.58.6", default-features = false, optional = true }
sse-stream = { version = "0.2", optional = true }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"], optional = true }
dioxus-icons = { version = "0.1.0", default-features = false, optional = true }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "f5a10a65526f4e2aae8de10c36607472716ddeba", default-features = false, optional = true }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "f5a10a65526f4e2aae8de10c36607472716ddeba", optional = true }
az-plugin-manifest = { path = "../manifest", default-features = false }
az-plugin-package = { path = "../package", optional = true }
gloo-net = { version = "0.6.0", features = ["http", "json"], optional = true }
flate2 = { version = "1.1.2", optional = true }
kuchikiki = { version = "=0.8.8-speedreader", optional = true }
mime_guess = { version = "2.0.5", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
schemars = { workspace = true, optional = true }
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"], optional = true }
tar = { version = "0.4.44", optional = true }
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
http-body = { version = "1", optional = true }
toml = { version = "0.9.5", optional = true }
tower-http = { version = "0.6.2", features = ["fs", "compression-gzip", "compression-br"], optional = true }
uuid = { version = "1.18.1", features = ["v4", "v5"], optional = true }
wasmtime = { version = "48.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "gc-drc", "runtime", "std"], optional = true }
web-sys = { version = "0.3.77", features = ["AbortSignal", "Document", "Element", "Node", "History", "Location", "Url", "UrlSearchParams", "Window"], optional = true }

[features]
test-support = ["server"]
components = ["dep:az-plugin-bundle", "dep:az-plugin-contract", "dep:az-plugin-runtime", "dep:az-plugin-core", "dep:az-plugin-enhancement", "dep:async-trait", "dep:semver", "dep:getrandom", "dep:futures-util"]
default = []
wasm = ["server", "dep:wasmtime", "az-plugin-runtime/wasm", "az-plugin-manifest/wasm-validation"]
sidecar = ["server"]
remote = ["server", "dep:arc-swap", "dep:prost", "dep:prost-reflect", "dep:process-wrap", "dep:nix", "dep:jsonschema", "dep:sse-stream", "tokio-util/io", "rmcp/client", "rmcp/transport-async-rw", "rmcp/transport-streamable-http-client", "tonic/tls-webpki-roots"]
ui = ["dep:dioxus", "dep:dioxus-icons", "dep:az-dioxus-admin-shell", "dep:az-ui-components"]
web = ["ui", "dioxus/web", "dioxus/launch", "dep:gloo-net", "dep:web-sys"]
desktop = ["ui", "dioxus/desktop", "dioxus/launch", "dep:gloo-net", "dep:web-sys"]
server = ["dep:schemars", "dep:tokio-util", "dep:http-body", "dep:jsonwebtoken","components", "az-plugin-manifest/validation", "az-plugin-contract/grpc", "dep:rmcp", "dep:tonic", "axum/http2", "dep:az-plugin-package", "dep:axum", "dep:flate2", "dep:kuchikiki", "dep:mime_guess", "dep:reqwest", "dep:sha2", "dep:sqlx", "dep:tar", "dep:tokio", "dep:toml", "dep:tower-http", "dep:uuid"]

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.1", default-features = false, features = ["signal"], optional = true }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["io-std"] }
jsonschema = { version = "0.58.6", default-features = false }
prost-types = "0.14.4"
tonic-prost = "0.14.6"
tempfile = "3.23.0"
reqwest = { version = "0.12.23", default-features = false, features = ["http2"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false }

[[example]]
name = "mcp-stdio-fixture"
path = "tests/stdio/fixture.rs"
required-features = ["remote"]
