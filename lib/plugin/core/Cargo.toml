[package]
name = "az-plugin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Plugin contracts, HTTP boundaries, PostgreSQL handles, and dynamic records for AIO."
workspace = "../../.."

[dependencies]
anyhow.workspace = true
dill.workspace = true
axum = { workspace = true, optional = true }
evalexpr = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
toasty = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
default = ["infrastructure"]
infrastructure = ["dep:axum", "dep:evalexpr", "dep:regex", "dep:serde", "dep:serde_json", "dep:sqlx", "dep:toasty", "dep:tokio", "dep:tracing", "dep:uuid"]

[dev-dependencies]
tower.workspace = true
tokio.workspace = true

[lints]
workspace = true
