[package]
name = "az-plugin-enhancement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded Rhai and TypeScript host enhancements for AIO."

[features]
default = ["rhai", "typescript"]
rhai = ["dep:rhai"]
typescript = ["dep:rquickjs", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_codegen", "dep:oxc_parser", "dep:oxc_semantic", "dep:oxc_span", "dep:oxc_transformer"]

[dependencies]
anyhow.workspace = true
az-plugin-contract = { path = "../contract" }
dill.workspace = true
rhai = { version = "1.26.1", features = ["sync", "serde", "no_module"], optional = true }
rquickjs = { version = "0.14.0", optional = true }
oxc_allocator = { version = "=0.146.0", optional = true }
oxc_ast = { version = "=0.146.0", optional = true }
oxc_codegen = { version = "=0.146.0", optional = true }
oxc_parser = { version = "=0.146.0", optional = true }
oxc_semantic = { version = "=0.146.0", optional = true }
oxc_span = { version = "=0.146.0", optional = true }
oxc_transformer = { version = "=0.146.0", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
