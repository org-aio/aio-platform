[package]
name = "az-plugin-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Language-neutral repository manifest and artifact validation for AIO plugins."
repository.workspace = true
workspace = "../../.."

[features]
default = []
schema = ["dep:schemars"]
dependency-validation = ["dep:anyhow", "dep:semver", "dep:url"]
validation = ["dependency-validation", "dep:toml", "dep:wasmtime", "dep:wit-component", "dep:wit-parser"]

[dependencies]
anyhow = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
url = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
wit-component = { workspace = true, optional = true }
wit-parser = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
